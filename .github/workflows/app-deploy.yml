name: Application Deploy

on:
    push:
        branches: [main]
        paths:
            - "app/stratum-service/**"

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: us-east-1
    ECR_REGISTRY: 688365520256.dkr.ecr.us-east-1.amazonaws.com
    ECR_REPOSITORY: stratum-platform
    EKS_CLUSTER: eks-platform

jobs:
    build-and-deploy:
        name: Build and Deploy
        runs-on: ubuntu-latest
        environment: aws-production

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  role-session-name: GitHubActions
                  aws-region: ${{ env.AWS_REGION }}

            - name: Assume Terraform Role
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
                  role-session-name: Deploy
                  aws-region: ${{ env.AWS_REGION }}
                  role-chaining: true

            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Set image tag
              id: tag
              run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

            - name: Build and push image
              run: |
                  docker build \
                    -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }} \
                    -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest \
                    app/stratum-service/

                  docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
                  docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

            - name: Update kubeconfig
              run: |
                  aws eks update-kubeconfig \
                    --region ${{ env.AWS_REGION }} \
                    --name ${{ env.EKS_CLUSTER }}

            - name: Deploy to EKS
              run: |
                  kubectl apply -f app/stratum-service/k8s/namespace.yaml
                  kubectl apply -f app/stratum-service/k8s/serviceaccount.yaml
                  kubectl apply -f app/stratum-service/k8s/deployment.yaml
                  kubectl apply -f app/stratum-service/k8s/service.yaml

                  kubectl set image deployment/stratum-app \
                    stratum-service=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }} \
                    -n stratum

                  kubectl rollout status deployment/stratum-app \
                    -n stratum \
                    --timeout=300s
