apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratum-app
  namespace: stratum
  labels:
    app: stratum-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stratum-app
  template:
    metadata:
      labels:
        app: stratum-app
    spec:
      serviceAccountName: stratum-app
      containers:
        - name: stratum-service
          image: 688365520256.dkr.ecr.us-east-1.amazonaws.com/stratum-platform:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: SECRET_NAME
              value: "stratum/platform/app-config"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10